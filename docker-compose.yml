# SIGNAL local development infrastructure.
# The migration creates the unprivileged `signal_app` role; the app connects
# as that role so Postgres RLS applies. The superuser account below is for
# migrations/administration only.
services:
  db:
    image: postgres:16-alpine
    # Observed exiting 255 on its own twice in one session — a host sleep or
    # Docker Desktop restart is enough. Every SIGNAL surface then fails at
    # once, and the failure reads as "password authentication failed" rather
    # than "the database is gone", which sends you looking in the wrong
    # place. Restart it automatically; a deliberate `docker compose stop`
    # still stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_dev_only
      POSTGRES_DB: signal_dev
    ports:
      - "5432:5432"
    volumes:
      - signal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal_pgdata:
