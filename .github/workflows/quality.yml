name: SIGNAL quality
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: signal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U signal -d signal_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SIGNAL_TEST_DATABASE_URL: postgresql+psycopg://signal:ci_synthetic_only@localhost:5432/signal_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python scripts/run_local_tests.py -q --tb=short
