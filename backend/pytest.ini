[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # `error` stays the default: a DeprecationWarning from SIGNAL's own code
    # is a defect and must fail the run, not scroll past.
    error
    # dateutil calls `utcfromtimestamp()` at IMPORT time on Python 3.12, and
    # alembic imports dateutil. Under `error` that becomes a hard failure —
    # but only for whichever test file happens to import alembic INSIDE a
    # fixture rather than at collection, so whole files passed or errored
    # depending on test ORDER. Nothing in this repository can fix a warning
    # raised inside a dependency's module body, and pinning around it is not
    # available (it is the current release). Ignored by message AND module so
    # the same deprecation in our own code still fails.
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:dateutil.tz.tz
